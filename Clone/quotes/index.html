<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic code Generator</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .container{
        height: 100vh;
        width: 100vw;
        background-color: black;
        
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box{
        background-color: goldenrod;
        border: 3px solid yellow;
        border-radius: 10px;
        text-align: center;
        padding: 30px;
        box-shadow: 0 0 50px 10px yellow;
    }
</style>
<body>
    <div class="container">
        <div class="box">
            <p id="heading">Dynamic Quote Generator</p>
            <p id="quote"></p>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
